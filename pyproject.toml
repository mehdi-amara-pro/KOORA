[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koora"
version = "0.1.0"
description = "KOORA: explainable, personalised match intelligence from synthetic football data, built on Azure."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/koora"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # (str, Enum) kept for clarity; StrEnum is equivalent

[tool.pytest.ini_options]
testpaths = ["tests"]
